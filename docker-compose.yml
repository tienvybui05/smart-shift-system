services:
  postgres:
    image: postgres:17-alpine
    container_name: smart-shift-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_shift_db}
      POSTGRES_USER: ${POSTGRES_USER:-smart_shift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_shift_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./smart-shift-be
      dockerfile: Dockerfile
    container_name: smart-shift-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smart_shift_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-smart_shift}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-smart_shift_password}
      JWT_SECRET: ${JWT_SECRET:-smart-shift-development-jwt-secret-change-me-2026}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-PT1H}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-true}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin@123456}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./smart-shift-fe
      dockerfile: Dockerfile
    container_name: smart-shift-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
