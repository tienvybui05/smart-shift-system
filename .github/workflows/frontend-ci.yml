name: Frontend checks
on:
  workflow_call:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      
    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: './smart-shift-fe/package-lock.json'
        
    - name: Install Dependencies
      working-directory: ./smart-shift-fe
      run: npm ci
      
    - name: Run Linter
      working-directory: ./smart-shift-fe
      run: npm run lint
      
    - name: Build Project
      working-directory: ./smart-shift-fe
      run: npm run build
