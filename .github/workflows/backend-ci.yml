name: Backend CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'smart-shift-be/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'smart-shift-be/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smart_shift_db
          POSTGRES_USER: smart_shift
          POSTGRES_PASSWORD: smart_shift_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Grant execute permission for Maven Wrapper
      working-directory: ./smart-shift-be
      run: chmod +x mvnw
        
    - name: Build and Test (Maven Package)
      working-directory: ./smart-shift-be
      run: ./mvnw clean package -B