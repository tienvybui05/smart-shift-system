spring:
  application:
    name: smart-shift-be
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smart_shift_db}
    username: ${SPRING_DATASOURCE_USERNAME:smart_shift}
    password: ${SPRING_DATASOURCE_PASSWORD:smart_shift_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

app:
  integrations:
    lark:
      enabled: ${LARK_ENABLED:false}
      webhook-url: ${LARK_WEBHOOK_URL:}
      secret: ${LARK_WEBHOOK_SECRET:}
      app-enabled: ${LARK_APP_ENABLED:false}
      app-id: ${LARK_APP_ID:}
      app-secret: ${LARK_APP_SECRET:}
      api-base-url: ${LARK_API_BASE_URL:https://open.larksuite.com/open-apis}
      smart-shift-url: ${SMART_SHIFT_PUBLIC_URL:http://localhost:3000}
      connect-timeout: ${LARK_CONNECT_TIMEOUT:PT5S}
      request-timeout: ${LARK_REQUEST_TIMEOUT:PT10S}
      max-attempts: ${LARK_MAX_ATTEMPTS:3}
      retry-delay: ${LARK_RETRY_DELAY:PT30S}
      worker:
        initial-delay-ms: ${LARK_WORKER_INITIAL_DELAY_MS:5000}
        fixed-delay-ms: ${LARK_WORKER_FIXED_DELAY_MS:5000}
  notifications:
    sse:
      heartbeat-ms: ${NOTIFICATION_SSE_HEARTBEAT_MS:25000}
  attendance:
    absence-reconciliation:
      enabled: ${ATTENDANCE_ABSENCE_RECONCILIATION_ENABLED:true}
      initial-delay-ms: ${ATTENDANCE_ABSENCE_RECONCILIATION_INITIAL_DELAY_MS:10000}
      fixed-delay-ms: ${ATTENDANCE_ABSENCE_RECONCILIATION_FIXED_DELAY_MS:900000}
  security:
    jwt:
      secret: ${JWT_SECRET:smart-shift-development-jwt-secret-change-me-2026}
      issuer: smart-shift-system
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:PT1H}
    bootstrap-admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
      username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@123456}
