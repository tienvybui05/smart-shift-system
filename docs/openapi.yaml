  responses:
    BadRequest:
      description: Dữ liệu không hợp lệ hoặc vi phạm quy tắc nghiệp vụ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            fieldErrors: {}
            timestamp: 2026-01-01T00:00:00Z
            path: /api/...
            error: Bad Request
            message: Dữ liệu không hợp lệ hoặc vi phạm quy tắc nghiệp vụ
            status: 400
    Unauthorized:
      description: "Sai thông tin đăng nhập, thiếu hoặc hết hạn JWT"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            fieldErrors: {}
            timestamp: 2026-01-01T00:00:00Z
            path: /api/...
            error: Unauthorized
            message: "Sai thông tin đăng nhập, thiếu hoặc hết hạn JWT"
            status: 401
    Forbidden:
      description: "Không có quyền, khác chi nhánh hoặc không sở hữu dữ liệu"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            fieldErrors: {}
            timestamp: 2026-01-01T00:00:00Z
            path: /api/...
            error: Forbidden
            message: "Không có quyền, khác chi nhánh hoặc không sở hữu dữ liệu"
            status: 403
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            fieldErrors: {}
            timestamp: 2026-01-01T00:00:00Z
            path: /api/...
            error: Not Found
            message: Không tìm thấy tài nguyên
            status: 404
    Conflict:
      description: "Dữ liệu trùng, đang được tham chiếu hoặc đã thay đổi đồng thời"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            fieldErrors: {}
            timestamp: 2026-01-01T00:00:00Z
            path: /api/...
            error: Conflict
            message: "Dữ liệu trùng, đang được tham chiếu hoặc đã thay đổi đồng thờ\
              i"
