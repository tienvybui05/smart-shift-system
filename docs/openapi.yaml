openapi: 3.0.3
info:
  title: Smart Shift System API
  description: API Documentation cho Hệ thống Quản lý Nhân sự và Tối ưu hóa Lịch làm việc (Smart Shift System)
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local server
components:
  schemas:
    CalendarPlacementRequest:
      type: object
      required: [userId, targetWorkShiftId, reason]
      description: Bỏ sourceAssignmentId khi thêm người. Khi chuyển phải gửi cả sourceAssignmentId, sourceWorkShiftId và expectedVersion từ board mới nhất.
      properties:
        userId: {type: integer, format: int64, minimum: 1}
        targetWorkShiftId: {type: integer, format: int64, minimum: 1}
        sourceAssignmentId: {type: integer, format: int64, minimum: 1, nullable: true}
        sourceWorkShiftId: {type: integer, format: int64, minimum: 1, nullable: true}
        expectedVersion: {type: integer, format: int64, minimum: 0, nullable: true}
        reason: {type: string, minLength: 1, maxLength: 1000}
    CalendarPlacementPreview:
      type: object
      properties:
        eligible: {type: boolean}
        violations: {type: array, items: {type: string}}
        warnings: {type: array, items: {type: string}}
        projectedDailyHours: {type: number}
        projectedWeeklyHours: {type: number}
    CalendarPlacementResponse:
      type: object
      properties:
        assignmentId: {type: integer, format: int64}
        userId: {type: integer, format: int64}
        sourceWorkShiftId: {type: integer, format: int64, nullable: true}
        targetWorkShiftId: {type: integer, format: int64}
        version: {type: integer, format: int64}
        warnings: {type: array, items: {type: string}}
    ScheduleBoardResponse:
      type: object
      properties:
        periodId: {type: integer, format: int64}
        periodName: {type: string}
        periodStatus: {type: string, enum: [DRAFT, GENERATING, PUBLISHED, LOCKED]}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        locationId: {type: integer, format: int64}
        locationName: {type: string}
        timezone: {type: string}
        generatedAt: {type: string, format: date-time}
        employees:
          type: array
          items:
            type: object
            properties:
              id: {type: integer, format: int64}
              employeeCode: {type: string, nullable: true}
              fullName: {type: string}
              positionId: {type: integer, format: int64}
              positionName: {type: string}
              maxHoursPerDay: {type: number}
              maxHoursPerWeek: {type: number}
              minRestHours: {type: number}
        shifts:
          type: array
          items:
            type: object
            properties:
              editable: {type: boolean}
              shift: {type: object, description: WorkShiftResponse như API quản lý ca; chứa id, workDate, startTime, endTime, durationMinutes, breakMinutes, overnight, shiftTemplateName, colorCode và status.}
              requirements:
                type: array
                items:
                  type: object
                  properties:
                    positionId: {type: integer, format: int64}
                    positionName: {type: string}
                    minEmployees: {type: integer}
                    maxEmployees: {type: integer}
                    assignedEmployees: {type: integer}
                    requirementId: {type: integer, format: int64}
                    positionCode: {type: string}
                    minimumMet: {type: boolean}
                    maximumReached: {type: boolean}
              assignments:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: integer, format: int64}
                    userId: {type: integer, format: int64}
                    employeeCode: {type: string, nullable: true}
                    fullName: {type: string}
                    positionId: {type: integer, format: int64}
                    positionName: {type: string}
                    source: {type: string, enum: [AUTO, MANUAL, SWAP, CLAIM]}
                    version: {type: integer, format: int64, minimum: 0}
                    editable: {type: boolean}
    WeeklyBudgetRequest:
      type: object
      properties:
        weeklyBudget:
          type: number
          nullable: true
          minimum: 0
          maximum: 9999999999999.99
          multipleOf: 0.01
          description: VND mỗi tuần; null bỏ cấu hình, 0 là ngân sách bằng 0. Đây là mục tiêu mềm.
    WeeklyBudgetSettings:
      type: object
      properties:
        locationId: {type: integer, format: int64}
        locationName: {type: string}
        timezone: {type: string}
        weeklyBudget: {type: number, nullable: true}
    ScheduleBudgetWeek:
      type: object
      properties:
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        periodCost: {type: number}
        otherPeriodsCost: {type: number}
        totalCost: {type: number}
        excess: {type: number, minimum: 0}
        remaining: {type: number, nullable: true}
        utilizationPercent: {type: number, nullable: true, description: Null khi chưa cấu hình hoặc ngân sách bằng 0}
        assignedShifts: {type: integer}
    ScheduleBudgetResponse:
      type: object
      properties:
        schedulePeriodId: {type: integer, format: int64}
        locationId: {type: integer, format: int64}
        locationName: {type: string}
        timezone: {type: string}
        weeklyBudget: {type: number, nullable: true}
        periodCost: {type: number}
        overBudget: {type: boolean}
        weeks:
          type: array
          items: {$ref: '#/components/schemas/ScheduleBudgetWeek'}
    AttendanceCorrectionRequest:
      type: object
      required: [shiftAssignmentId, checkInAt, checkOutAt, breakMinutes, reason]
      properties:
        shiftAssignmentId: {type: integer, format: int64, minimum: 1}
        checkInAt: {type: string, format: date-time}
        checkOutAt: {type: string, format: date-time}
        breakMinutes: {type: integer, minimum: 0, maximum: 1440}
        reason: {type: string, minLength: 1, maxLength: 1000}
    AttendanceCorrectionReview:
      type: object
      required: [approved, note]
      properties:
        approved: {type: boolean}
        note: {type: string, minLength: 1, maxLength: 1000}
    AttendanceCorrectionResponse:
      type: object
      properties:
        id: {type: integer, format: int64}
        shiftAssignmentId: {type: integer, format: int64}
        employeeId: {type: integer, format: int64}
        employeeCode: {type: string}
        employeeName: {type: string}
        locationId: {type: integer, format: int64}
        locationName: {type: string}
        timezone: {type: string}
        workDate: {type: string, format: date}
        shiftStartAt: {type: string, format: date-time}
        shiftEndAt: {type: string, format: date-time}
        checkInAt: {type: string, format: date-time}
        checkOutAt: {type: string, format: date-time}
        breakMinutes: {type: integer}
        reason: {type: string}
        status: {type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED]}
        beforeData:
          type: string
          description: JSON snapshot bản công lúc gửi; chuỗi null khi chưa có công.
        reviewedByName: {type: string, nullable: true}
        reviewedAt: {type: string, format: date-time, nullable: true}
        reviewNote: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
    AttendanceHistoryResponse:
      type: object
      properties:
        id: {type: integer, format: int64}
        actorName: {type: string}
        action: {type: string, enum: [CHECK_IN, CHECK_OUT, MANUAL_APPROVAL, CORRECTION_APPROVED]}
        reason: {type: string}
        beforeData: {type: string, description: JSON snapshot trước thay đổi}
        afterData: {type: string, description: JSON snapshot sau thay đổi}
        createdAt: {type: string, format: date-time}
  parameters:
    CorrectionStart:
      in: query
      name: startDate
      required: true
      schema: {type: string, format: date}
    CorrectionEnd:
      in: query
      name: endDate
      required: true
      schema: {type: string, format: date}
    CorrectionId:
      in: path
      name: id
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    AttendanceAssignmentId:
      in: query
      name: shiftAssignmentId
      required: true
      schema: {type: integer, format: int64, minimum: 1}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
paths:
  /api/schedule-periods/{periodId}/board:
    parameters:
      - &calendarPeriodId
        in: path
        name: periodId
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    get:
      summary: Lịch trực quan và nhân viên hoạt động trong chi nhánh
      description: Admin/Manager đúng phạm vi. Bao gồm cả lịch công bố/khóa để xem; không trả email, số điện thoại hay lương nhân viên.
      responses:
        '200':
          description: Snapshot toàn kỳ; editable phản ánh trạng thái và thời gian hiện tại.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScheduleBoardResponse'}
        '403': {description: Không có quyền hoặc khác chi nhánh}
        '404': {description: Không tìm thấy kỳ lịch}
  /api/schedule-periods/{periodId}/board/preview:
    parameters: [*calendarPeriodId]
    post:
      summary: Xem trước kết quả phân công hoặc chuyển người giữa ca
      description: Chỉ đọc; không bảo đảm chỗ trống khi lưu. Chuyển người loại trừ ca nguồn khỏi kiểm tra trùng lịch và giờ làm.
      requestBody: &calendarPlacementBody
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CalendarPlacementRequest'}
      responses:
        '200':
          description: Kết quả hợp lệ hoặc danh sách vi phạm; warnings không chặn lưu ở kỳ nháp.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalendarPlacementPreview'}
        '400': {description: Request sai hoặc nhân viên/kỳ lịch không khớp}
        '403': {description: Ngoài phạm vi quản lý}
        '409': {description: Nguồn hoặc version thay đổi; tải lại board}
  /api/schedule-periods/{periodId}/board/place:
    parameters: [*calendarPeriodId]
    post:
      summary: Lưu phân công kéo thả theo giao dịch nguyên tử
      description: Khóa dữ liệu và kiểm tra lại toàn bộ. Chỉ ca OPEN/FILLED tương lai trong kỳ DRAFT; không chuyển phân công đã có công. Giữ mã phân công, tăng version và audit hai ca khi chuyển.
      requestBody: *calendarPlacementBody
      responses:
        '200':
          description: Đã lưu; ca nguồn có thể thiếu người và cần bổ sung trước công bố.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalendarPlacementResponse'}
        '400': {description: Vi phạm ràng buộc; giao dịch không thay đổi phân công}
        '403': {description: Ngoài phạm vi quản lý}
        '404': {description: Kỳ lịch, ca hoặc nhân viên không còn tồn tại}
        '409': {description: Version hoặc dữ liệu xung đột; tải lại board}
  /api/attendances/export:
    get:
      summary: Xuất bảng chấm công Excel XLSX theo bộ lọc và phạm vi Admin/Manager
      description: Tối đa 93 ngày và 100000 bản ghi; có sheet thông tin, chi tiết và tổng hợp. File không sửa dữ liệu công.
      parameters:
        - $ref: '#/components/parameters/CorrectionStart'
        - $ref: '#/components/parameters/CorrectionEnd'
        - in: query
          name: locationId
          schema: {type: integer, format: int64, minimum: 1}
        - in: query
          name: status
          schema: {type: string, enum: [PRESENT, LATE, EARLY_LEAVE, ABSENT]}
      responses:
        '200':
          description: File XLSX đính kèm; Cache-Control no-store. Kết quả rỗng vẫn có tiêu đề.
          headers:
            Content-Disposition:
              schema: {type: string}
              description: attachment; filename=bang_cham_cong_YYYY-MM-DD_YYYY-MM-DD.xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        '400': {description: Bộ lọc không hợp lệ hoặc vượt giới hạn xuất}
        '401': {description: Chưa xác thực}
        '403': {description: Không có quyền hoặc ngoài chi nhánh}
  /api/payroll/export:
    get:
      summary: Xuất snapshot bảng lương Excel XLSX trong phạm vi Admin/Manager
      description: Khớp đúng ngày đầu/cuối kỳ như API tra cứu bảng lương. Giữ trạng thái nháp, xác nhận, cần tính lại công; không tự tính lại hoặc xác nhận lương.
      parameters:
        - $ref: '#/components/parameters/CorrectionStart'
        - $ref: '#/components/parameters/CorrectionEnd'
        - in: query
          name: locationId
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: File XLSX đính kèm; Cache-Control no-store. Tối đa 100000 bản ghi.
          headers:
            Content-Disposition:
              schema: {type: string}
              description: attachment; filename=bang_luong_YYYY-MM-DD_YYYY-MM-DD.xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        '400': {description: Khoảng ngày không hợp lệ hoặc vượt giới hạn xuất}
        '401': {description: Chưa xác thực}
        '403': {description: Không có quyền hoặc ngoài chi nhánh}
  /api/schedules/generate:
    post:
      summary: Sinh lịch tự động bằng ALNS–CP-SAT
      description: >
        Admin/Manager trong phạm vi chi nhánh tạo phân công AUTO cho kỳ DRAFT.
        Giữ nguyên các phân công đã có; chỉ bổ sung tới nhu cầu tối thiểu.
        CP-SAT khởi tạo và ALNS dùng CP-SAT để sửa từng vùng lịch.
        qualityScore là chỉ số độ phủ/nguyện vọng; optimization.objective là điểm phạt cần giảm.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schedulePeriodId]
              properties:
                schedulePeriodId:
                  type: integer
                  format: int64
                  minimum: 1
      responses:
        '201':
          description: Lịch đã được lưu và ghi audit
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedulePeriodId:
                    type: integer
                    format: int64
                  assignmentsCreated:
                    type: integer
                  unfilledPositions:
                    type: integer
                  coveragePercentage:
                    type: number
                  preferencePercentage:
                    type: number
                  qualityScore:
                    type: number
                    description: Chỉ số mô tả độ phủ/nguyện vọng, không phải optimality gap
                  assignments:
                    type: array
                    items:
                      type: object
                      properties:
                        score:
                          type: number
                          nullable: true
                          description: Null với phân công hybrid; không chấm điểm Greedy từng người
                  shortages:
                    type: array
                    items:
                      type: object
                  warnings:
                    type: array
                    items:
                      type: string
                  optimization:
                    type: object
                    properties:
                      algorithm:
                        type: string
                        enum: [ALNS_CP_SAT]
                      status:
                        type: string
                        enum: [OPTIMAL, FEASIBLE, NO_CANDIDATES]
                        description: OPTIMAL chỉ được báo nếu constructor chứng minh tối ưu toàn mô hình
                      objective:
                        type: integer
                        format: int64
                      iterations:
                        type: integer
                      elapsedMillis:
                        type: integer
                        format: int64
                      seed:
                        type: integer
                      operatorWeights:
                        type: array
                        items:
                          type: number
        '400':
          description: Kỳ không hợp lệ hoặc bộ giải chưa tìm được nghiệm; không lưu phân công mới
        '401':
          description: Chưa xác thực
        '403':
          description: Không có quyền quản lý kỳ lịch
        '404':
          description: Không tìm thấy kỳ lịch
  /api/auth/login:
    post:
      summary: Đăng nhập
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: Admin@123456
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
  /api/attendance-corrections/me:
    get:
      summary: Nhân viên xem đơn điều chỉnh công của mình
      description: Lọc ngày ca theo múi giờ chi nhánh; khoảng tra cứu tối đa 93 ngày.
      parameters:
        - $ref: '#/components/parameters/CorrectionStart'
        - $ref: '#/components/parameters/CorrectionEnd'
      responses:
        '200':
          description: Danh sách đơn của nhân viên
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AttendanceCorrectionResponse'}
        '400': {description: Khoảng ngày sai}
        '403': {description: Chỉ Employee}
    post:
      summary: Nhân viên gửi đơn bổ sung hoặc điều chỉnh công
      description: >
        Chỉ ca đã kết thúc trong 30 ngày, thuộc người gửi và lịch đã công bố.
        Tạo đơn PENDING, chưa sửa công. Chặn khi có đơn chờ trùng hoặc kỳ lương đã xác nhận.
        Giờ vào tối đa 2 giờ trước ca, giờ ra tối đa 12 giờ sau ca và không ở tương lai.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttendanceCorrectionRequest'}
      responses:
        '201':
          description: Đã tạo đơn chờ duyệt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttendanceCorrectionResponse'}
        '400': {description: Dữ liệu hoặc trạng thái nghiệp vụ không hợp lệ}
        '403': {description: Chỉ Employee}
        '404': {description: Không thấy phân công hoặc không sở hữu}
        '409': {description: Đã có đơn chờ cho ca này}
  /api/attendance-corrections/me/{id}/cancel:
    patch:
      summary: Nhân viên hủy đơn PENDING của mình
      parameters:
        - $ref: '#/components/parameters/CorrectionId'
      responses:
        '200':
          description: Đã hủy đơn, công không thay đổi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttendanceCorrectionResponse'}
        '400': {description: Đơn không còn PENDING}
        '403': {description: Chỉ Employee}
        '404': {description: Không thấy hoặc không sở hữu}
  /api/attendance-corrections:
    get:
      summary: Admin hoặc quản lý xem hàng đợi điều chỉnh công
      parameters:
        - $ref: '#/components/parameters/CorrectionStart'
        - $ref: '#/components/parameters/CorrectionEnd'
        - in: query
          name: locationId
          schema: {type: integer, format: int64, minimum: 1}
        - in: query
          name: status
          schema: {type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED]}
      responses:
        '200':
          description: Danh sách trong phạm vi chi nhánh
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AttendanceCorrectionResponse'}
        '400': {description: Bộ lọc sai}
        '403': {description: Không có quyền hoặc ngoài chi nhánh}
  /api/attendance-corrections/{id}/review:
    patch:
      summary: Duyệt hoặc từ chối đơn điều chỉnh công
      description: >
        Admin hoặc Manager đúng chi nhánh; không tự duyệt. Chỉ xử lý PENDING một lần.
        Khi duyệt, kiểm tra baseline chưa thay đổi và lương chưa xác nhận; lưu công, audit,
        đánh dấu lương nháp cần tính lại và gửi thông báo trong cùng transaction.
      parameters:
        - $ref: '#/components/parameters/CorrectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttendanceCorrectionReview'}
      responses:
        '200':
          description: Đã xử lý đơn
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttendanceCorrectionResponse'}
        '400': {description: Đã xử lý, hết hạn, baseline thay đổi, tự duyệt hoặc lương đã xác nhận}
        '403': {description: Không có quyền hoặc ngoài chi nhánh}
        '404': {description: Không thấy đơn}
  /api/attendance-corrections/me/history:
    get:
      summary: Nhân viên xem lịch sử công của mình
      parameters:
        - $ref: '#/components/parameters/AttendanceAssignmentId'
      responses:
        '200':
          description: Lịch sử mới nhất trước; không tạo dữ liệu hồi tố
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AttendanceHistoryResponse'}
        '403': {description: Chỉ Employee}
        '404': {description: Không thấy hoặc không sở hữu phân công}
  /api/attendance-corrections/history:
    get:
      summary: Admin hoặc quản lý xem lịch sử công theo phân công
      parameters:
        - $ref: '#/components/parameters/AttendanceAssignmentId'
      responses:
        '200':
          description: Lịch sử trong phạm vi được phép
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AttendanceHistoryResponse'}
        '403': {description: Không có quyền hoặc ngoài chi nhánh}
        '404': {description: Không thấy phân công}
  /api/scheduling-budgets/locations/{id}:
    parameters:
      - $ref: '#/components/parameters/CorrectionId'
    get:
      summary: Đọc ngân sách tuần của chi nhánh trong phạm vi Admin/Manager
      responses:
        '200':
          description: Cấu hình hiện tại
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WeeklyBudgetSettings'}
        '403': {description: Không có quyền hoặc ngoài chi nhánh}
        '404': {description: Không thấy chi nhánh}
    patch:
      summary: Cập nhật riêng ngân sách tuần, không thay đổi GPS hoặc cấu hình mạng
      requestBody:
