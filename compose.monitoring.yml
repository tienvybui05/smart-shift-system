# Overlay either docker-compose.yml or compose.attendance-test.yml.
# Run setup_monitoring.py first. No application database/volume is redefined here.
services:
  backend:
    environment:
      MONITORING_ENABLED: 'true'
      MONITORING_PASSWORD_FILE: /run/secrets/metrics_password
    secrets:
      - metrics_password
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./ops/monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    secrets:
      - metrics_password
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-29090}:9090'
    depends_on:
      backend:
        condition: service_healthy
  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: 'false'
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-23001}:3000'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    depends_on:
      prometheus:
        condition: service_healthy
secrets:
  metrics_password:
    file: ./.secrets/metrics_password
  grafana_admin_password:
    file: ./.secrets/grafana_admin_password
volumes:
  prometheus_data:
  grafana_data:
