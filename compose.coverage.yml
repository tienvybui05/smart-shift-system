      - '127.0.0.1:25432:5432'
  backend:
    image: smart-shift-attendance-backend:coverage
    build:
      context: ./smart-shift-be
      dockerfile: ../qa-automation/coverage/Dockerfile
    ports:
      - '127.0.0.1:26300:26300'
