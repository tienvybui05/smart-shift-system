groups:
  - name: smart-shift
    rules:
      - alert: SmartShiftBackendDown
        expr: up{job="smart-shift"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Backend cannot be scraped for more than one minute
      - alert: SmartShiftHttpErrors
        expr: sum(rate(http_server_requests_seconds_count{job="smart-shift",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="smart-shift"}[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 5 percent HTTP requests return server errors
      - alert: SmartShiftSlowRequests
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="smart-shift",uri!~"/actuator/.*|/livez|/readyz"}[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: HTTP p95 latency exceeds one second
      - alert: SmartShiftHeapPressure
        expr: sum(jvm_memory_used_bytes{job="smart-shift",area="heap"}) / sum(jvm_memory_max_bytes{job="smart-shift",area="heap"}) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: JVM heap usage exceeds 85 percent
      - alert: SmartShiftDatabasePoolWaiting
        expr: hikaricp_connections_pending{job="smart-shift"} > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Database connection pool has waiting threads
